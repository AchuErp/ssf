<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#dfe8ea;
    font-family:Arial, Helvetica, sans-serif;
}

/*=========================
SECTION
=========================*/

.gallery-section{
    padding:80px 0;
}

.small-title{
    font-size:12px;
    letter-spacing:4px;
    color:#8d979d;
    text-transform:uppercase;
    margin-bottom:20px;
}

.small-title::before{
    content:"";
    width:40px;
    height:1px;
    background:#9aa4a8;
    display:inline-block;
    margin-right:15px;
    vertical-align:middle;
}

.main-title{
    font-size:80px;
    font-weight:800;
    margin-bottom:20px;
}

.sub-title{
    font-size:22px;
    color:#4f5b65;
    max-width:850px;
    margin-bottom:70px;
}

/*=========================
CARD
=========================*/

.gallery-card{

    position:relative;

    border-radius:28px;

    overflow:hidden;

    box-shadow:0 12px 30px rgba(0,0,0,.12);

    transition:.35s;

}

.gallery-card:hover{

    transform:translateY(-8px);

}

.gallery-card img{

    width:100%;

    height:320px;

    object-fit:cover;

    transition:.4s;

}

.gallery-card:hover img{

    transform:scale(1.05);

}

.album{

    position:absolute;

    top:18px;

    left:18px;

    background:#efefef;

    color:#222;

    padding:8px 18px;

    border-radius:25px;

    font-size:12px;

    font-weight:700;

    letter-spacing:.5px;

}

@media(max-width:992px){

.main-title{

font-size:55px;

}

.gallery-card img{

height:250px;

}

}

</style>

</head>
<body>

<section class="gallery-section">

<div class="container">

<p class="small-title">
MOMENTS IN MOTION
</p>

<h1 class="main-title">
Gallery
</h1>

<p class="sub-title">
Explore moments from our community programs, events, and initiatives across Kerala.
</p>

<div class="row g-4">

<!-- Card 1 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

<img src="event1.avif" alt="">

<div class="album">
ALBUM
</div>

</div>

</div>

<!-- Card 2 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

<img src="event2.avif" alt="">

<div class="album">

</div>

</div>

</div>

<!-- Card 3 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

<img src="event3.avif" alt="">

<div class="album">
ALBUM
</div>

</div>

</div>

<!-- Card 4 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

<img src="event4.avif" alt="">

<div class="album">

</div>

</div>

</div>

<!-- Card 5 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

<img src="event5.avif" alt="">

<div class="album">

</div>

</div>

</div>

<!-- Card 6 -->

<div class="col-lg-4 col-md-6">

<div class="gallery-card">

</div>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
