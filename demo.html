<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        footer {
            background: #2d2d2d;
            color: #d9d9d9;
            padding: 70px 0 25px;
        }

        footer h5 {
            color: #fff;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .footer-logo {
            font-size: 2rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 30px;
        }

        .footer-logo span {
            color: #f7b733;
        }

        .footer-links a {
            display: block;
            color: #bdbdbd;
            text-decoration: none;
            margin-bottom: 12px;
            transition: .3s;
        }

        .footer-links a:hover {
            color: #fff;
            padding-left: 5px;
        }

        .social-icons a {
            color: #bdbdbd;
            font-size: 22px;
            margin-right: 15px;
            transition: .3s;
        }

        .social-icons a:hover {
            color: #fff;
        }

        .footer-bottom {
            border-top: 1px solid #444;
            margin-top: 40px;
            padding-top: 20px;
        }

        .developer {
            display: flex;
            align-items: center;
            justify-content: end;
            gap: 12px;
        }

        .developer img {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }

        .developer h6 {
            margin: 0;
            color: #fff;
            font-weight: 600;
        }

        .developer small {
            color: #aaa;
        }

        @media(max-width:768px){
            .developer{
                justify-content:center;
                margin-top:20px;
            }

            .footer-bottom{
                text-align:center;
            }
        }
    </style>
</head>
<body>

<footer>

<div class="container">

    <div class="row gy-4">

        <!-- Logo -->
        <div class="col-lg-3 col-md-6">

            <div class="footer-logo">
                <span>SSF</span> KERALA
            </div>

            <div class="social-icons mt-4">
                <a href="#"><i class="bi bi-instagram"></i></a>
                <a href="#"><i class="bi bi-twitter-x"></i></a>
                <a href="#"><i class="bi bi-facebook"></i></a>
                <a href="#"><i class="bi bi-youtube"></i></a>
            </div>

        </div>

        <!-- Quick Links -->
        <div class="col-lg-2 col-md-6">
            <h5>Quick Links</h5>

            <div class="footer-links">
                <a href="#">Home</a>
                <a href="#">About Us</a>
                <a href="#">News</a>
                <a href="#">Campaigns</a>
            </div>

        </div>

        <!-- Resources -->
        <div class="col-lg-2 col-md-6">
            <h5>Resources</h5>

            <div class="footer-links">
                <a href="#">Blogs</a>
                <a href="#">Downloads</a>
                <a href="#">Gallery</a>
            </div>

        </div>

        <!-- Get Involved -->
        <div class="col-lg-2 col-md-6">
            <h5>Get Involved</h5>

            <div class="footer-links">
                <a href="#">Donate</a>
                <a href="#">Contact Us</a>
            </div>

        </div>

        <!-- Headquarters -->
        <div class="col-lg-3 col-md-6">
            <h5>Headquarters</h5>

            <p class="mb-2">
                Students' Centre,<br>
                Kozhikode, Kerala, India – 673001
            </p>

            <p class="mb-2">
                <i class="bi bi-telephone"></i>
                +91 97444 00991
            </p>

            <p>
                <i class="bi bi-envelope"></i>
                mail@ssfkerala.org
            </p>

        </div>

    </div>

    <!-- Bottom -->

    <div class="footer-bottom">

        <div class="row align-items-center">

            <div class="col-md-6">
                <small>
                    © 2026 SSF KERALA • SSF State Technical Directorate
                </small>
            </div>

            <!-- Developer -->
            <div class="col-md-6">

                <div class="developer">

                    <!-- Replace image path -->
                    <img src="images/developer.jpg" alt="Developer">

                    <div>
                        <h6>Your Name</h6>
                        <small>Web Developer</small>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</footer>

</body>
</html>
