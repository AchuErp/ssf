<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Our Campaigns</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#eef4f6;
    font-family:Arial,Helvetica,sans-serif;
}

/* Section */

.campaign-section{
    padding:80px 0;
}

/* Small Heading */

.section-tag{
    display:flex;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.section-tag span:first-child{
    width:40px;
    height:1px;
    background:#9eb1bb;
}

.section-tag p{
    margin:0;
    letter-spacing:3px;
    color:#90a4ae;
    font-size:12px;
    text-transform:uppercase;
    font-weight:600;
}

/* Title */

.section-title{
    font-size:72px;
    font-weight:800;
    color:#000;
    margin-bottom:20px;
}

.section-subtitle{
    font-size:20px;
    color:#495057;
    margin-bottom:60px;
}

/* Card */

.campaign-card{
    background:#fff;
    border-radius:25px;
    overflow:hidden;
    transition:.4s;
    height:100%;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.campaign-card:hover{
    transform:translateY(-10px);
    box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.campaign-card img{
    width:100%;
    height:260px;
    object-fit:cover;
}

.campaign-content{
    padding:25px;
}

.status{
    display:inline-block;
    padding:8px 18px;
    border-radius:30px;
    background:#e8f8eb;
    color:#00a63f;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
}

.campaign-title{
    margin-top:20px;
    font-size:32px;
    font-weight:700;
    color:#111;
}

/* Responsive */

@media(max-width:992px){

.section-title{
    font-size:48px;
}

.campaign-card img{
    height:220px;
}

}

</style>
</head>

<body>

<section class="campaign-section">

<div class="container">

<div class="section-tag">

<span></span>

<p>Campaigns & Initiatives</p>

</div>

<h1 class="section-title">
Our Campaigns
</h1>

<p class="section-subtitle">
Join us in making a difference through our ongoing initiatives and programs
</p>

<div class="row g-4">

<!-- Card 1 -->

<div class="col-lg-6">

<div class="campaign-card">

<img src="cam1.avif" alt="Campaign">

<div class="campaign-content">

<span class="status">
ACTIVE
</span>

<h3 class="campaign-title">
കൂടിത്തോട്ടം
</h3>

</div>

</div>

</div>

<!-- Card 2 -->

<div class="col-lg-6">

<div class="campaign-card">

<img src="cam2.avif" alt="Campaign">

<div class="campaign-content">

<span class="status">
ACTIVE
</span>

<h3 class="campaign-title">
സാഹിത്യാസ്വാദ്
</h3>

</div>

</div>

</div>

</div>

</div>

</section>

</body>
</html>
